<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: #0f0f10;
      color: #e8e8ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #f5f5f7; }
    .settings-link {
      font-size: 11px; color: #6e6ef0; cursor: pointer; text-decoration: none;
    }
    .settings-link:hover { text-decoration: underline; }
    .section-title {
      font-size: 10px; font-weight: 600; color: #55555f;
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .provider-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px;
      background: #1a1a1f; margin-bottom: 6px;
    }
    .provider-icon { font-size: 16px; width: 20px; text-align: center; }
    .provider-name { flex: 1; font-weight: 500; }
    .badge-connected {
      font-size: 10px; font-weight: 600;
      color: #4ade80; background: rgba(74,222,128,0.12);
      padding: 2px 7px; border-radius: 20px;
    }
    .badge-disconnected {
      font-size: 10px; font-weight: 600;
      color: #55555f; background: #1f1f26;
      padding: 2px 7px; border-radius: 20px;
    }
    .connect-btn {
      font-size: 11px; cursor: pointer; border: none;
      background: #6e6ef0; color: #fff;
      padding: 4px 10px; border-radius: 6px; font-weight: 500;
    }
    .connect-btn:hover { background: #5e5ed8; }
    .divider { border: none; border-top: 1px solid #2a2a30; margin: 12px 0; }
    .commands { margin-top: 2px; }
    .cmd-row {
      display: flex; gap: 8px; align-items: baseline;
      padding: 4px 0;
    }
    .cmd { font-family: monospace; color: #6e6ef0; font-size: 12px; width: 72px; flex-shrink: 0; }
    .cmd-desc { color: #9999a8; font-size: 11px; }
    .footer { margin-top: 14px; font-size: 10px; color: #3a3a44; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">𝕄 Fluent</span>
    <a class="settings-link" id="settingsLink">Settings →</a>
  </div>

  <div class="section-title">Connected Accounts</div>
  <div id="providerList">
    <div class="provider-row">
      <span class="provider-icon">✦</span>
      <span class="provider-name">Loading…</span>
    </div>
  </div>

  <hr class="divider" />

  <div class="section-title">Trigger Commands</div>
  <div class="commands">
    <div class="cmd-row"><span class="cmd">/fixit</span><span class="cmd-desc">Fix spelling &amp; grammar</span></div>
    <div class="cmd-row"><span class="cmd">/rewrite</span><span class="cmd-desc">Rewrite for clarity &amp; flow</span></div>
    <div class="cmd-row"><span class="cmd">/formal</span><span class="cmd-desc">More formal tone</span></div>
    <div class="cmd-row"><span class="cmd">/casual</span><span class="cmd-desc">More casual tone</span></div>
  </div>

  <div id="hint" style="display:none;margin-top:10px;padding:10px;background:#1a1a1f;border-radius:8px;font-size:11px;color:#facc15;text-align:center;">
    Add an API key in <a id="settingsLink2" style="color:#facc15;cursor:pointer;text-decoration:underline;">Settings</a> to get started
  </div>
  <div class="footer">Type a trigger command at the end of any text field</div>
  <script type="module" src="../src/popup/popup.ts"></script>
</body>
</html>
